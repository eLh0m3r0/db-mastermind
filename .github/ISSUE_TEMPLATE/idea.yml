name: Idea
description: Something you'd find useful, or that is harder than it should be.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you want to do and why. How you do it elsewhere today (DBeaver, DataGrip, Beekeeper…) helps too. Česky klidně taky.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
