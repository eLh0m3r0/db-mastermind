name: Bug
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste passwords, connection strings with a password or sensitive data here: a description is enough, and a screenshot with the data blurred if it helps.
        Česky klidně taky.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what the app did (the exact text of the error, if there was one).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Open the table …
        3. …
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [PostgreSQL, SQL Server, Oracle, MySQL, MariaDB, SQLite, DuckDB, ClickHouse, CockroachDB, BigQuery, Trino, Not database-specific]
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About (filled in for you when you report from the app's Help menu).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots, notes
      description: Drop a screenshot here. The update log is in <data folder>/logs/updater.log.
