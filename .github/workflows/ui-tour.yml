name: UI tour

# Screenshots of the real app window on Windows and Linux (English and Czech), to review what colleagues see.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx electron-vite build
        working-directory: apps/desktop
      - name: Screenshots
        shell: bash
        run: |
          mkdir -p shots/en shots/cs
          run() { if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a --server-args="-screen 0 1920x1080x24" "$@"; else "$@"; fi; }
          SHOTS_DIR=shots/en run node e2e/screenshots.mjs
          DBM_LANGUAGE=cs run node e2e/tour-settings.mjs shots/cs
          DBM_LANGUAGE=en run node e2e/tour-settings.mjs shots/en
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-tour-${{ matrix.os }}
          path: shots
