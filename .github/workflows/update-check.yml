name: Auto-update check

# Installs an old version with the Windows installer, lets it find, download and install the latest release
# through electron-updater, and checks that the installed version changed.
#   current: the code in this commit, built as version 0.0.1 (tests the updater code before it ships)
#   release: the previous release (tests what users actually have)
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      from:
        description: 'Release to install first for the "release" job (default: the one before the latest)'
        required: false

permissions:
  contents: read

jobs:
  current:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build an installer of this code as version 0.0.1
        working-directory: apps/desktop
        shell: bash
        run: npx electron-vite build && npx electron-builder --win nsis --x64 --publish never --config.extraMetadata.version=0.0.1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install it silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/*0.0.1*setup*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\DB Mastermind\DB Mastermind.exe"
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          Get-Content "$env:LOCALAPPDATA\Programs\DB Mastermind\resources\app-update.yml"
      - name: Update to the latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/update-check.ps1 -Latest ((gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName) -replace '^v', '')

  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick versions
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ github.event.inputs.from }}
        run: |
          tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 10 --json tagName,isDraft,isPrerelease -q '[.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName] | join(" ")')
          latest=$(echo $tags | cut -d' ' -f1)
          from="${FROM:-$(echo $tags | cut -d' ' -f2)}"
          echo "latest=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "from=${from#v}" >> "$GITHUB_OUTPUT"
          echo "Updating ${from#v} → ${latest#v}"
      - name: Install the older release silently
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.v.outputs.from }}'
          gh release download "v$v" -R $env:GITHUB_REPOSITORY -p "DB-Mastermind-$v-win-x64-setup.exe" -D $env:RUNNER_TEMP
          Start-Process "$env:RUNNER_TEMP\DB-Mastermind-$v-win-x64-setup.exe" -ArgumentList '/S' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\DB Mastermind\DB Mastermind.exe")) { throw 'Not installed' }
      - name: Update to the latest release
        shell: pwsh
        run: ./.github/scripts/update-check.ps1 -Latest '${{ steps.v.outputs.latest }}'
