name: Windows install check

# Installs a release with each Windows installer (x64 and arm64, on matching runners) the way a user does, then checks
# where the app landed, what the Start menu shortcut points to, and that the installed exe starts.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: latest)'
        required: false
      build:
        description: 'Also build an arm64 installer from this commit on Windows on Arm and install it'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = gh release view -R $env:GITHUB_REPOSITORY --json tagName -q .tagName }
          gh release download $tag -R $env:GITHUB_REPOSITORY -p "*-win-${{ matrix.arch }}-setup.exe" -p "*-win-setup.exe" -D setup
          Get-ChildItem setup | Format-Table Name, Length
      - name: What the installers carry
        shell: pwsh
        run: Get-ChildItem setup/*.exe | ForEach-Object { ./.github/scripts/windows-installer-contents.ps1 -Setup $_.FullName }
      - name: Install with the ${{ matrix.arch }} installer
        shell: pwsh
        run: ./.github/scripts/windows-install-check.ps1 -Setup (Get-ChildItem setup/*-win-${{ matrix.arch }}-setup.exe | Select-Object -First 1).FullName
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Test tools (Playwright drives the installed app)
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Export to Excel and CSV in the installed app
        shell: pwsh
        run: |
          $env:DBM_EXE = "$env:LOCALAPPDATA\Programs\DB Mastermind\DB Mastermind.exe"
          node e2e/export-check.mjs "$env:RUNNER_TEMP\export"
      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $u = Get-ChildItem "$env:LOCALAPPDATA\Programs\DB Mastermind\Uninstall*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($u) { Start-Process $u.FullName -ArgumentList '/S' -Wait }
      - name: Install with the combined installer
        if: always()
        shell: pwsh
        run: ./.github/scripts/windows-install-check.ps1 -Setup (Get-ChildItem setup/*-win-setup.exe | Select-Object -First 1).FullName

  build-arm64:
    if: inputs.build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      - name: Build the arm64 installer the way release.yml does
        working-directory: apps/desktop
        shell: bash
        run: npx electron-vite build && npx electron-builder --win nsis --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_7Z_FILTER: BCJ
      - name: What it carries
        shell: pwsh
        run: ./.github/scripts/windows-installer-contents.ps1 -Setup (Get-ChildItem apps/desktop/release/*setup*.exe | Select-Object -First 1).FullName
      - name: Install it
        shell: pwsh
        run: ./.github/scripts/windows-install-check.ps1 -Setup (Get-ChildItem apps/desktop/release/*setup*.exe | Select-Object -First 1).FullName
      - name: Export to Excel and CSV in the installed app
        shell: pwsh
        run: |
          $env:DBM_EXE = "$env:LOCALAPPDATA\Programs\DB Mastermind\DB Mastermind.exe"
          node e2e/export-check.mjs "$env:RUNNER_TEMP\export"
