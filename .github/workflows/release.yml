name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release once; parallel electron-builder jobs would otherwise race and create duplicates.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "DB Mastermind ${TAG#v}" --generate-notes

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      # npm installs only the host's DuckDB binding; this runner also builds the other architecture.
      - name: DuckDB bindings for every target architecture
        shell: bash
        run: |
          V=$(node -p "require('@duckdb/node-bindings/package.json').version")
          case "$RUNNER_OS" in
            macOS) TARGETS="darwin-arm64 darwin-x64" ;;
            Windows) TARGETS="win32-x64 win32-arm64" ;;
            *) TARGETS="linux-x64" ;;
          esac
          for T in $TARGETS; do
            DEST="node_modules/@duckdb/node-bindings-$T"
            [ -d "$DEST" ] && continue
            npm pack "@duckdb/node-bindings-$T@$V" --silent
            mkdir -p "$DEST"
            tar -xzf "duckdb-node-bindings-$T-$V.tgz" -C "$DEST" --strip-components 1
          done
          ls node_modules/@duckdb
      - name: Build
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Builds are unsigned for now (see docs/STRATEGY.md).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder's own publishing looks the release up in the release list, which can lag right after the
      # create-release job; it then tries to create it again and fails with 422. Upload to the release by tag instead.
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest*.yml' \) | sort)
          echo "$files"
          for attempt in 1 2 3; do gh release upload "$GITHUB_REF_NAME" $files --clobber -R "$GITHUB_REPOSITORY" && break; sleep 20; done
      - name: Scoop manifest
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/scoop-manifest.mjs "$V" "apps/desktop/release/DB-Mastermind-$V-win-x64-portable.zip" "apps/desktop/release/DB-Mastermind-$V-win-arm64-portable.zip" > db-mastermind.json
          cat db-mastermind.json
          gh release upload "$GITHUB_REF_NAME" db-mastermind.json --clobber
      - name: MSI package (x64, for Intune / SCCM)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: |
          npx electron-builder --win msi --x64 --prepackaged release/win-unpacked --publish never
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then gh release upload "$GITHUB_REF_NAME" release/*.msi --clobber -R "$GITHUB_REPOSITORY"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Microsoft Store package (MSIX, signed by the Store)
        # Needs the app's identity from Partner Center as repository variables (see docs/microsoft-store.md).
        if: runner.os == 'Windows' && vars.MSSTORE_IDENTITY_NAME != ''
        working-directory: apps/desktop
        shell: bash
        run: >
          npx electron-builder --win appx --x64 --prepackaged release/win-unpacked --publish never
          --config.appx.identityName="${{ vars.MSSTORE_IDENTITY_NAME }}"
          --config.appx.publisher="${{ vars.MSSTORE_PUBLISHER }}"
          --config.appx.publisherDisplayName="${{ vars.MSSTORE_PUBLISHER_NAME }}"
          --config.appx.applicationId=DBMastermind
          --config.appx.displayName="DB Mastermind"
          --config.appx.artifactName='DB-Mastermind-${version}-store.${ext}'
          && if [[ "$GITHUB_REF" == refs/tags/v* ]]; then gh release upload "$GITHUB_REF_NAME" release/*-store.appx --clobber -R "$GITHUB_REPOSITORY"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Homebrew cask
        # The repository doubles as a tap: brew tap elh0m3r0/db-mastermind https://github.com/eLh0m3r0/db-mastermind
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/homebrew-cask.mjs "$V" "apps/desktop/release/DB-Mastermind-$V-mac-arm64.dmg" "apps/desktop/release/DB-Mastermind-$V-mac-x64.dmg" > "$RUNNER_TEMP/db-mastermind.rb"
          cat "$RUNNER_TEMP/db-mastermind.rb"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/tap" && git fetch -q origin main && git worktree add -q -f "$RUNNER_TEMP/tap" origin/main
            mkdir -p "$RUNNER_TEMP/tap/Casks" && cp "$RUNNER_TEMP/db-mastermind.rb" "$RUNNER_TEMP/tap/Casks/db-mastermind.rb"
            git -C "$RUNNER_TEMP/tap" add Casks/db-mastermind.rb
            if git -C "$RUNNER_TEMP/tap" diff --cached --quiet; then break; fi
            git -C "$RUNNER_TEMP/tap" commit -qm "Homebrew cask $V [skip ci]"
            if git -C "$RUNNER_TEMP/tap" push -q origin HEAD:main; then break; fi
            git worktree remove -f "$RUNNER_TEMP/tap"; sleep 5
          done

  # Opens a pull request on microsoft/winget-pkgs (from a fork under the token's account) with the new version.
  # Needs a WINGET_TOKEN secret (classic token with public_repo) and the package already in winget-pkgs.
  winget:
    needs: desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/e/eLh0m3r0/DBMastermind >/dev/null 2>&1; then
            echo "::notice::eLh0m3r0.DBMastermind is not in winget-pkgs yet (first submission still in review)"; exit 0
          fi
          curl -fsSL https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          KOMAC=$(find "$RUNNER_TEMP" -name komac -type f | head -1)
          U="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          "$KOMAC" update eLh0m3r0.DBMastermind --version "$V" \
            --urls "$U/DB-Mastermind-$V-win-x64-setup.exe" "$U/DB-Mastermind-$V-win-arm64-setup.exe" "$U/DB-Mastermind-$V-win-x64.msi" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --submit --token "$WINGET_TOKEN"

  mcp-npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      # Optional: add an NPM_TOKEN repository secret to publish the standalone MCP server.
      # (setup-node fills NODE_AUTH_TOKEN with a placeholder, so test our own variable.)
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      - name: Publish dbmastermind-mcp
        if: env.NPM_TOKEN != ''
        run: npm publish -w packages/mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
