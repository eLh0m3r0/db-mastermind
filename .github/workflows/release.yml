name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mcp_only:
        description: Only dbmastermind-mcp (npm and the MCP registry); no app builds, nothing uploaded to the release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Create the release once; parallel electron-builder jobs would otherwise race and create duplicates.
  create-release:
    runs-on: ubuntu-latest
    if: ${{ !inputs.mcp_only }}
    steps:
      - uses: actions/checkout@v4
      # A manual run from a branch builds the apps (uploads are tag-only below) but must not make a release or a tag
      # named after the branch.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The notes written for the release (.github/release-notes/<tag>.md) go out with it. GitHub's generated
          # list lacks the Website / Privacy footer every release must carry: a tag without its notes fails instead.
          NOTES=".github/release-notes/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing: write the release notes before tagging."
            exit 1
          fi
          if ! grep -q 'dbmastermind.app/privacy.html' "$NOTES"; then
            echo "::error::$NOTES lacks the footer: Website: [dbmastermind.app](https://dbmastermind.app) · [Privacy](https://dbmastermind.app/privacy.html)"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "DB Mastermind ${TAG#v}" --notes-file "$NOTES"

  desktop:
    needs: create-release
    if: ${{ !inputs.mcp_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      # '1' once the Apple Developer ID secrets exist (docs/macos-notarization.md).
      MAC_NOTARIZE: ${{ secrets.APPLE_API_KEY_ID != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      # npm installs only the host's DuckDB binding; this runner also builds the other architecture.
      - name: DuckDB bindings for every target architecture
        shell: bash
        run: |
          V=$(node -p "require('@duckdb/node-bindings/package.json').version")
          case "$RUNNER_OS" in
            macOS) TARGETS="darwin-arm64 darwin-x64" ;;
            Windows) TARGETS="win32-x64 win32-arm64" ;;
            *) TARGETS="linux-x64" ;;
          esac
          for T in $TARGETS; do
            DEST="node_modules/@duckdb/node-bindings-$T"
            [ -d "$DEST" ] && continue
            npm pack "@duckdb/node-bindings-$T@$V" --silent
            mkdir -p "$DEST"
            tar -xzf "duckdb-node-bindings-$T-$V.tgz" -C "$DEST" --strip-components 1
          done
          ls node_modules/@duckdb
      # macOS: signed with the project's own certificate (secrets MAC_SIGN_P12 / MAC_SIGN_PASSWORD) so the signature's
      # identity is the same in every release and the keychain keeps trusting updates (build/after-pack.cjs).
      - name: rcodesign (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tar.gz" https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
          echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $RUNNER_TEMP/rcodesign.tar.gz" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/apple-codesign-0.29.0-macos-universal/rcodesign" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Apple Developer ID yet (see docs/STRATEGY.md): electron-builder doesn't sign; after-pack does.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 7-Zip compresses arm64 executables with its ARM64 filter, which the installer's older Nsis7z plugin can't
          # undo: the Windows on Arm installer then installed only the uninstaller. BCJ is one it understands.
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
          # Apple Developer ID: when all five exist, after-pack signs with the hardened runtime and notarizes instead
          # (docs/macos-notarization.md). Absent, they are empty and nothing changes.
          MAC_DEVID_P12: ${{ secrets.MAC_DEVID_P12 }}
          MAC_DEVID_PASSWORD: ${{ secrets.MAC_DEVID_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # A manual run from a branch releases nothing; with a Developer ID its notarized macOS files are kept here for the
      # first-run test plan in docs/macos-notarization.md.
      - name: Notarized macOS files (manual runs)
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/v') && env.MAC_NOTARIZE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: macos-notarized
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac-*.zip
            apps/desktop/release/latest-mac.yml
          retention-days: 7
      # electron-builder's own publishing looks the release up in the release list, which can lag right after the
      # create-release job; it then tries to create it again and fails with 422. Upload to the release by tag instead.
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest*.yml' \) | sort)
          echo "$files"
          for attempt in 1 2 3; do gh release upload "$GITHUB_REF_NAME" $files --clobber -R "$GITHUB_REPOSITORY" && break; sleep 20; done
      - name: Scoop manifest
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/scoop-manifest.mjs "$V" "apps/desktop/release/DB-Mastermind-$V-win-x64-portable.zip" "apps/desktop/release/DB-Mastermind-$V-win-arm64-portable.zip" > db-mastermind.json
          cat db-mastermind.json
          gh release upload "$GITHUB_REF_NAME" db-mastermind.json --clobber
      - name: MSI package (x64, for Intune / SCCM)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: |
          npx electron-builder --win msi --x64 --prepackaged release/win-unpacked --publish never
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then gh release upload "$GITHUB_REF_NAME" release/*.msi --clobber -R "$GITHUB_REPOSITORY"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Microsoft Store package (MSIX, signed by the Store)
        # Needs the app's identity from Partner Center as repository variables (see docs/microsoft-store.md).
        if: runner.os == 'Windows' && vars.MSSTORE_IDENTITY_NAME != ''
        # A problem with the Store package must not stop the release itself.
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        run: >
          npx electron-builder --win appx --x64 --prepackaged release/win-unpacked --publish never
          --config.appx.identityName="${{ vars.MSSTORE_IDENTITY_NAME }}"
          --config.appx.publisher="${{ vars.MSSTORE_PUBLISHER }}"
          --config.appx.publisherDisplayName="${{ vars.MSSTORE_PUBLISHER_NAME }}"
          --config.appx.applicationId=DBMastermind
          --config.appx.displayName="DB Mastermind"
          --config.appx.artifactName='DB-Mastermind-${version}-store.${ext}'
          && if [[ "$GITHUB_REF" == refs/tags/v* ]]; then gh release upload "$GITHUB_REF_NAME" release/*-store.appx --clobber -R "$GITHUB_REPOSITORY"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Homebrew cask
        # The repository doubles as a tap: brew tap elh0m3r0/db-mastermind https://github.com/eLh0m3r0/db-mastermind
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          DBM_NOTARIZED="$MAC_NOTARIZE" node scripts/homebrew-cask.mjs "$V" "apps/desktop/release/DB-Mastermind-$V-mac-arm64.dmg" "apps/desktop/release/DB-Mastermind-$V-mac-x64.dmg" > "$RUNNER_TEMP/db-mastermind.rb"
          cat "$RUNNER_TEMP/db-mastermind.rb"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/tap" && git fetch -q origin main && git worktree add -q -f "$RUNNER_TEMP/tap" origin/main
            mkdir -p "$RUNNER_TEMP/tap/Casks" && cp "$RUNNER_TEMP/db-mastermind.rb" "$RUNNER_TEMP/tap/Casks/db-mastermind.rb"
            git -C "$RUNNER_TEMP/tap" add Casks/db-mastermind.rb
            if git -C "$RUNNER_TEMP/tap" diff --cached --quiet; then break; fi
            git -C "$RUNNER_TEMP/tap" commit -qm "Homebrew cask $V [skip ci]"
            if git -C "$RUNNER_TEMP/tap" push -q origin HEAD:main; then break; fi
            git worktree remove -f "$RUNNER_TEMP/tap"; sleep 5
          done

  # Opens a pull request on microsoft/winget-pkgs (from a fork under the token's account) with the new version.
  # Needs a WINGET_TOKEN secret (classic token with public_repo) and the package already in winget-pkgs.
  winget:
    needs: desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/e/eLh0m3r0/DBMastermind >/dev/null 2>&1; then
            echo "::notice::eLh0m3r0.DBMastermind is not in winget-pkgs yet (first submission still in review)"; exit 0
          fi
          curl -fsSL https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          KOMAC=$(find "$RUNNER_TEMP" -name komac -type f | head -1)
          U="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          "$KOMAC" update eLh0m3r0.DBMastermind --version "$V" \
            --urls "$U/DB-Mastermind-$V-win-x64-setup.exe" "$U/DB-Mastermind-$V-win-arm64-setup.exe" "$U/DB-Mastermind-$V-win-x64.msi" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --submit --token "$WINGET_TOKEN"

  # dbmastermind-mcp on npm, then its entry in the MCP registry (packages/mcp/server.json). Runs with a release tag,
  # or by hand (Run workflow, "Use workflow from" the release tag, mcp_only) to publish a release whose tag came
  # before the npm credentials. Publishes only from a v* tag whose version is the package's.
  # Credentials: npm trusted publishing (OIDC, no token) when the repository variable NPM_TRUSTED_PUBLISHING is 1,
  # otherwise the NPM_TOKEN secret; with neither it skips. The MCP registry needs no secret (GitHub OIDC).
  # A version already on npm or in the registry is skipped, so a rerun finishes what a failed run left.
  mcp-npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
      MCP_PUBLISHER_VERSION: v1.8.8
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: What to publish
        id: plan
        run: |
          V=$(node -p "require('./packages/mcp/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$NPM_TRUSTED_PUBLISHING" = "1" ]; then AUTH=oidc
          elif [ -n "$NPM_TOKEN" ]; then AUTH=token
          else
            echo "::notice::dbmastermind-mcp is not published: add the NPM_TOKEN secret, or set the repository variable NPM_TRUSTED_PUBLISHING to 1 once npm trusts this workflow."
            echo "auth=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::notice::Nothing is published from $GITHUB_REF: run the workflow from the release tag."
            echo "auth=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but packages/mcp/package.json says $V."; exit 1
          fi
          echo "auth=$AUTH" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "dbmastermind-mcp@$V" version 2>/dev/null)" = "$V" ]; then
            echo "::notice::dbmastermind-mcp@$V is already on npm."; echo "npm=done" >> "$GITHUB_OUTPUT"
          fi
          NAME=$(node -p "encodeURIComponent(require('./packages/mcp/server.json').name)")
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/$NAME/versions/$V"; then
            echo "::notice::The MCP registry already lists $V."; echo "registry=done" >> "$GITHUB_OUTPUT"
          fi
      - run: npm install --no-audit --no-fund
        if: steps.plan.outputs.auth != 'none' && steps.plan.outputs.npm != 'done'
      # The packed package must install from its tarball and answer over stdio before it goes out.
      - name: Check the packed package
        if: steps.plan.outputs.auth != 'none' && steps.plan.outputs.npm != 'done'
        run: node packages/mcp/test/packed-package.mjs
      - name: Publish dbmastermind-mcp to npm
        if: steps.plan.outputs.auth != 'none' && steps.plan.outputs.npm != 'done'
        run: |
          # Trusted publishing needs npm 11.5.1 or newer.
          npm install -g npm@11.21.2
          npm publish -w packages/mcp --access public --provenance
        env:
          # setup-node points .npmrc at NODE_AUTH_TOKEN; with trusted publishing it stays empty and npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ steps.plan.outputs.auth == 'token' && secrets.NPM_TOKEN || '' }}
      - name: Install cosign
        if: steps.plan.outputs.auth != 'none' && steps.plan.outputs.registry != 'done'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.plan.outputs.auth != 'none' && steps.plan.outputs.registry != 'done'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$RUNNER_TEMP/$archive"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the MCP registry
        if: steps.plan.outputs.auth != 'none' && steps.plan.outputs.registry != 'done'
        run: |
          # The registry reads mcpName from the npm package: give a fresh publish a moment to show up there.
          for i in 1 2 3 4 5 6; do
            [ "$(npm view "dbmastermind-mcp@${{ steps.plan.outputs.version }}" version 2>/dev/null)" = "${{ steps.plan.outputs.version }}" ] && break
            sleep 20
          done
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          for i in 1 2 3; do "$RUNNER_TEMP/mcp-publisher" publish packages/mcp/server.json && exit 0; sleep 30; done
          exit 1
