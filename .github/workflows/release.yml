name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mcp_only:
        description: Only dbmastermind-mcp (npm and the MCP registry); no app builds, nothing uploaded to the release
        type: boolean
        default: false

# Read-only unless a job says otherwise.
permissions:
  contents: read

jobs:
  # Create the release once; parallel electron-builder jobs would otherwise race and create duplicates.
  create-release:
    runs-on: ubuntu-latest
    if: ${{ !inputs.mcp_only }}
    permissions:
      contents: write
    steps:
      # No token in .git/config: only the step that creates the release gets one. The repository is public, so the
      # fetch below needs none.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release (and everything that publishes from it) is made only from a commit that is on main. Push main and
      # the tag in one `git push --atomic origin main vX.Y.Z` (or main first): a tag that arrives before main fails here
      # and needs a re-run once main is pushed.
      - name: The tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main: tag a commit of main."
            exit 1
          fi
      # A manual run from a branch builds the apps (uploads are tag-only below) but must not make a release or a tag
      # named after the branch.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The notes written for the release (.github/release-notes/<tag>.md) go out with it. GitHub's generated
          # list lacks the Website / Privacy footer every release must carry: a tag without its notes fails instead.
          NOTES=".github/release-notes/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing: write the release notes before tagging."
            exit 1
          fi
          if ! grep -q 'dbmastermind.app/privacy.html' "$NOTES"; then
            echo "::error::$NOTES lacks the footer: Website: [dbmastermind.app](https://dbmastermind.app) · [Privacy](https://dbmastermind.app/privacy.html)"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "DB Mastermind ${TAG#v}" --notes-file "$NOTES"

  # Conditions downstream of a job that may be skipped name their status check (see mcp-publish).
  desktop:
    needs: create-release
    if: ${{ !cancelled() && !inputs.mcp_only && needs.create-release.result == 'success' }}
    # Uploads to the release and pushes the Homebrew cask to main.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      # '1' once the Apple Developer ID secrets exist (docs/macos-notarization.md).
      MAC_NOTARIZE: ${{ secrets.APPLE_API_KEY_ID != '' && '1' || '' }}
    steps:
      # No token left in .git/config while dependencies install and run; the cask step authenticates its push itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      # npm installs only the host's DuckDB binding; this runner also builds the other architecture.
      - name: DuckDB bindings for every target architecture
        shell: bash
        run: |
          V=$(node -p "require('@duckdb/node-bindings/package.json').version")
          case "$RUNNER_OS" in
            macOS) TARGETS="darwin-arm64 darwin-x64" ;;
            Windows) TARGETS="win32-x64 win32-arm64" ;;
            *) TARGETS="linux-x64" ;;
          esac
          for T in $TARGETS; do
            DEST="node_modules/@duckdb/node-bindings-$T"
            [ -d "$DEST" ] && continue
            npm pack "@duckdb/node-bindings-$T@$V" --silent
            mkdir -p "$DEST"
            tar -xzf "duckdb-node-bindings-$T-$V.tgz" -C "$DEST" --strip-components 1
          done
          ls node_modules/@duckdb
      # macOS: signed with the project's own certificate (secrets MAC_SIGN_P12 / MAC_SIGN_PASSWORD) so the signature's
      # identity is the same in every release and the keychain keeps trusting updates (build/after-pack.cjs).
      - name: rcodesign (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tar.gz" https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
          echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $RUNNER_TEMP/rcodesign.tar.gz" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/apple-codesign-0.29.0-macos-universal/rcodesign" >> "$GITHUB_ENV"
      # Two build steps so the signing secrets reach the macOS leg only.
      - name: Build
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 7-Zip compresses arm64 executables with its ARM64 filter, which the installer's older Nsis7z plugin can't
          # undo: the Windows on Arm installer then installed only the uninstaller. BCJ is one it understands.
          ELECTRON_BUILDER_7Z_FILTER: BCJ
      - name: Build (macOS, signed)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          # electron-builder doesn't sign; after-pack does (self-signed, or Developer ID + notarization).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
          # Apple Developer ID: when all five exist, after-pack signs with the hardened runtime and notarizes instead
          # (docs/macos-notarization.md). Absent, they are empty and nothing changes.
          MAC_DEVID_P12: ${{ secrets.MAC_DEVID_P12 }}
          MAC_DEVID_PASSWORD: ${{ secrets.MAC_DEVID_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # A manual run from a branch releases nothing; with a Developer ID its notarized macOS files are kept here for the
      # first-run test plan in docs/macos-notarization.md.
      - name: Notarized macOS files (manual runs)
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/v') && env.MAC_NOTARIZE == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-notarized
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac-*.zip
            apps/desktop/release/latest-mac.yml
          retention-days: 7
      # electron-builder's own publishing looks the release up in the release list, which can lag right after the
      # create-release job; it then tries to create it again and fails with 422. Upload to the release by tag instead.
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest*.yml' \) | sort)
          echo "$files"
          for attempt in 1 2 3; do gh release upload "$GITHUB_REF_NAME" $files --clobber -R "$GITHUB_REPOSITORY" && break; sleep 20; done
      # Packaging steps run without any token; only the upload and push steps below get one, and only on tag runs.
      - name: Scoop manifest
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/scoop-manifest.mjs "$V" "apps/desktop/release/DB-Mastermind-$V-win-x64-portable.zip" "apps/desktop/release/DB-Mastermind-$V-win-arm64-portable.zip" > db-mastermind.json
          cat db-mastermind.json
      - name: Upload the Scoop manifest
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" db-mastermind.json --clobber -R "$GITHUB_REPOSITORY"
      - name: MSI package (x64, for Intune / SCCM)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --win msi --x64 --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload the MSI
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.msi --clobber -R "$GITHUB_REPOSITORY"
      - name: Microsoft Store package (MSIX, signed by the Store)
        id: store
        # Needs the app's identity from Partner Center as repository variables (see docs/microsoft-store.md).
        if: runner.os == 'Windows' && vars.MSSTORE_IDENTITY_NAME != ''
        # A problem with the Store package must not stop the release itself.
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        run: >
          npx electron-builder --win appx --x64 --prepackaged release/win-unpacked --publish never
          --config.appx.identityName="${{ vars.MSSTORE_IDENTITY_NAME }}"
          --config.appx.publisher="${{ vars.MSSTORE_PUBLISHER }}"
          --config.appx.publisherDisplayName="${{ vars.MSSTORE_PUBLISHER_NAME }}"
          --config.appx.applicationId=DBMastermind
          --config.appx.displayName="DB Mastermind"
          --config.appx.artifactName='DB-Mastermind-${version}-store.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload the Store package
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && steps.store.outcome == 'success'
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/*-store.appx --clobber -R "$GITHUB_REPOSITORY"
      - name: Homebrew cask
        # The repository doubles as a tap: brew tap elh0m3r0/db-mastermind https://github.com/eLh0m3r0/db-mastermind
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          DBM_NOTARIZED="$MAC_NOTARIZE" node scripts/homebrew-cask.mjs "$V" "apps/desktop/release/DB-Mastermind-$V-mac-arm64.dmg" "apps/desktop/release/DB-Mastermind-$V-mac-x64.dmg" > "$RUNNER_TEMP/db-mastermind.rb"
          cat "$RUNNER_TEMP/db-mastermind.rb"
      - name: Push the Homebrew cask to main
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/tap" && git fetch -q origin main && git worktree add -q -f "$RUNNER_TEMP/tap" origin/main
            mkdir -p "$RUNNER_TEMP/tap/Casks" && cp "$RUNNER_TEMP/db-mastermind.rb" "$RUNNER_TEMP/tap/Casks/db-mastermind.rb"
            git -C "$RUNNER_TEMP/tap" add Casks/db-mastermind.rb
            if git -C "$RUNNER_TEMP/tap" diff --cached --quiet; then break; fi
            git -C "$RUNNER_TEMP/tap" commit -qm "Homebrew cask $V [skip ci]"
            if git -C "$RUNNER_TEMP/tap" -c "http.https://github.com/.extraheader=$AUTH" push -q origin HEAD:main; then break; fi
            git worktree remove -f "$RUNNER_TEMP/tap"; sleep 5
          done

  # Opens a pull request on microsoft/winget-pkgs (from a fork under the token's account) with the new version.
  # Needs a WINGET_TOKEN secret (classic token with public_repo) and the package already in winget-pkgs.
  winget:
    needs: desktop
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.desktop.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    # Works only with its own WINGET_TOKEN.
    permissions: {}
    steps:
      - name: Is there a token?
        id: token
        env:
          HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: echo "set=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Submit to winget
        if: steps.token.outputs.set == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/e/eLh0m3r0/DBMastermind >/dev/null 2>&1; then
            echo "::notice::eLh0m3r0.DBMastermind is not in winget-pkgs yet (first submission still in review)"; exit 0
          fi
          curl -fsSL https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          KOMAC=$(find "$RUNNER_TEMP" -name komac -type f | head -1)
          U="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          "$KOMAC" update eLh0m3r0.DBMastermind --version "$V" \
            --urls "$U/DB-Mastermind-$V-win-x64-setup.exe" "$U/DB-Mastermind-$V-win-arm64-setup.exe" "$U/DB-Mastermind-$V-win-x64.msi" \
            --release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --submit --token "$WINGET_TOKEN"

  # dbmastermind-mcp on npm and in the MCP registry, in two jobs so nothing that installs or runs code ever sees a
  # credential. mcp-pack (no secrets, read-only token) decides what is left to publish, installs, builds, tests the
  # packed tarball and keeps that exact tarball; mcp-publish only publishes it.
  # Runs with a release tag after create-release (so the tag is on main and has its notes), or by hand from the tag
  # with mcp_only (create-release is skipped then; mcp-pack checks the tag itself). Published only from a v* tag on
  # main whose version is the package's and server.json's. A version already on npm or in the registry is skipped, so
  # a rerun finishes what a failed run left.
  mcp-pack:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || (inputs.mcp_only && needs.create-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      npm: ${{ steps.plan.outputs.npm }}
      registry: ${{ steps.plan.outputs.registry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: The tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main: tag a commit of main."
            exit 1
          fi
      - name: What to publish
        id: plan
        run: |
          # server.json, packages/mcp/package.json and the root version must agree (npm version keeps them so).
          node packages/mcp/sync-server-json.mjs --check
          V=$(node -p "require('./packages/mcp/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::notice::Nothing is published from $GITHUB_REF: run the workflow from the release tag."
            echo "publish=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but packages/mcp/package.json and server.json say $V."; exit 1
          fi
          npm=todo; registry=todo
          if [ "$(npm view "dbmastermind-mcp@$V" version 2>/dev/null)" = "$V" ]; then
            npm=done; echo "::notice::dbmastermind-mcp@$V is already on npm."
          fi
          NAME=$(node -p "encodeURIComponent(require('./packages/mcp/server.json').name)")
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/$NAME/versions/$V"; then
            registry=done; echo "::notice::The MCP registry already lists $V."
          fi
          echo "npm=$npm" >> "$GITHUB_OUTPUT"; echo "registry=$registry" >> "$GITHUB_OUTPUT"
          if [ $npm = done ] && [ $registry = done ]; then echo "publish=no" >> "$GITHUB_OUTPUT"; else echo "publish=yes" >> "$GITHUB_OUTPUT"; fi
      # No install scripts: the build is esbuild (its binary comes as an optional dependency, no script needed) and
      # nothing here starts Electron. Not `npm ci`: the lock file lacks esbuild's other-platform packages, which
      # npm ci refuses (CI run 44942181815).
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Pack (prepack bundles dist/)
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w packages/mcp --pack-destination "$RUNNER_TEMP/pack"
          cp packages/mcp/server.json "$RUNNER_TEMP/pack/server.json"
      # The tarball must install into an empty folder and answer over stdio; this is the file that gets published.
      - name: Check the packed package
        run: node packages/mcp/test/packed-package.mjs --tarball "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.plan.outputs.publish == 'yes'
        with:
          name: mcp-release
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/server.json
          retention-days: 7
          if-no-files-found: error

  # Runs whenever mcp-pack succeeded, and decides itself whether there is anything to publish. Its condition must name
  # its status check: with only the implicit success(), Actions skips it on an mcp_only run because create-release
  # (mcp-pack's own dependency) was skipped.
  mcp-publish:
    needs: mcp-pack
    if: ${{ !cancelled() && needs.mcp-pack.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
      VERSION: ${{ needs.mcp-pack.outputs.version }}
    steps:
      - name: Anything to publish?
        id: go
        env:
          PUBLISH: ${{ needs.mcp-pack.outputs.publish }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::notice::Nothing is published from $GITHUB_REF: run the workflow from the release tag."; echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" != yes ]; then
            echo "::notice::dbmastermind-mcp $VERSION is already on npm and in the MCP registry."; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      # Which npm credential exists, decided without its value ever entering a step's environment.
      - name: npm credentials
        if: steps.go.outputs.go == 'yes'
        id: auth
        env:
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$TRUSTED" = "1" ]; then auth=oidc; elif [ "$HAS_TOKEN" = "true" ]; then auth=token; else auth=none; fi
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "npm credentials: $auth"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.go.outputs.go == 'yes'
        with:
          name: mcp-release
          path: ${{ runner.temp }}/pack
      - name: The files are this release's
        if: steps.go.outputs.go == 'yes'
        run: |
          cd "$RUNNER_TEMP/pack"
          ls -la
          set -- dbmastermind-mcp-*.tgz
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then echo "::error::expected one tarball"; exit 1; fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(tar -xOzf "$1" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          INNER=$(tar -xOzf "$1" package/server.json | node -p "const s = JSON.parse(require('fs').readFileSync(0, 'utf8')); s.version + ' ' + s.packages[0].version")
          OUTER=$(node -p "const s = require('./server.json'); s.version + ' ' + s.packages[0].version")
          echo "tag $TAG, planned $VERSION, tarball $PKG, its server.json $INNER, registry server.json $OUTER"
          for v in "$VERSION" "$PKG" $INNER $OUTER; do
            if [ "$v" != "$TAG" ]; then echo "::error::version $v is not the tag's $TAG: nothing is published"; exit 1; fi
          done
          if ! cmp -s server.json <(tar -xOzf "$1" package/server.json); then echo "::error::server.json differs from the tarball's"; exit 1; fi
          echo "TARBALL=$RUNNER_TEMP/pack/$1" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.go.outputs.go == 'yes'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Its own step, before any token is in scope. Trusted publishing needs npm 11.5.1 or newer.
      - name: npm for trusted publishing
        if: steps.go.outputs.go == 'yes' && needs.mcp-pack.outputs.npm != 'done' && steps.auth.outputs.auth != 'none'
        run: npm install -g --ignore-scripts npm@11.21.2 && npm --version
      - name: Publish the tested tarball to npm
        if: steps.go.outputs.go == 'yes' && needs.mcp-pack.outputs.npm != 'done' && steps.auth.outputs.auth != 'none'
        run: |
          # Checked again here: "Re-run failed jobs" reuses mcp-pack's answer from before the first attempt.
          if [ "$(npm view "dbmastermind-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::dbmastermind-mcp@$VERSION is already on npm."; exit 0
          fi
          npm publish "$TARBALL" --access public --provenance
        env:
          # The token only in this step; with trusted publishing it stays empty and npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ steps.auth.outputs.auth == 'token' && secrets.NPM_TOKEN || '' }}
      - name: No npm credentials
        if: steps.go.outputs.go == 'yes' && needs.mcp-pack.outputs.npm != 'done' && steps.auth.outputs.auth == 'none'
        run: echo "::notice::dbmastermind-mcp $VERSION is not published to npm; add the NPM_TOKEN secret, or set the repository variable NPM_TRUSTED_PUBLISHING to 1 once npm trusts this workflow."
      - name: Install cosign
        if: steps.go.outputs.go == 'yes' && needs.mcp-pack.outputs.registry != 'done'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.go.outputs.go == 'yes' && needs.mcp-pack.outputs.registry != 'done'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$RUNNER_TEMP/$archive"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the MCP registry
        if: steps.go.outputs.go == 'yes' && needs.mcp-pack.outputs.registry != 'done'
        env:
          AUTH: ${{ steps.auth.outputs.auth }}
        run: |
          # The registry checks mcpName in the npm package: the version must be on npm first.
          for i in 1 2 3 4 5 6; do
            [ "$(npm view "dbmastermind-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ] && break
            if [ "$AUTH" = none ]; then echo "::notice::dbmastermind-mcp@$VERSION isn't on npm, so the registry entry waits."; exit 0; fi
            sleep 20
          done
          if [ "$(npm view "dbmastermind-mcp@$VERSION" version 2>/dev/null)" != "$VERSION" ]; then echo "::error::dbmastermind-mcp@$VERSION is not on npm"; exit 1; fi
          NAME=$(node -p "encodeURIComponent(require(process.env.RUNNER_TEMP + '/pack/server.json').name)")
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/$NAME/versions/$VERSION"; then
            echo "::notice::The MCP registry already lists $VERSION."; exit 0
          fi
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          for i in 1 2 3; do "$RUNNER_TEMP/mcp-publisher" publish "$RUNNER_TEMP/pack/server.json" && exit 0; sleep 30; done
          exit 1
