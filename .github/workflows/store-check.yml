name: Store check

# Reads DB Mastermind's Microsoft Store entry through the Store submission API and changes nothing: proves the
# MSSTORE_* secrets work and keeps the app's and its submissions' JSON as an artifact, the shape an automated
# listing update has to follow. Run it by hand: gh workflow run store-check.yml
#
# It speaks the API directly (curl): the msstore CLI's own configuration test refused these credentials although
# Microsoft Entra signs in and the API answers for this app.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_ID: 9P0GRD7BZ4NF
  API: https://manage.devcenter.microsoft.com/v1.0/my

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The credentials exist only in this step. Never prints a token: the log of this public repository is public.
      - name: Read the app and its submissions (nothing is changed)
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          echo "seller id: digits only $([[ "$SELLER" =~ ^[0-9]+$ ]] && echo yes || echo no), length ${#SELLER}"
          answer=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/token" \
            --data-urlencode grant_type=client_credentials --data-urlencode "client_id=$CLIENT" \
            --data-urlencode "client_secret=$SECRET" --data-urlencode resource=https://manage.devcenter.microsoft.com)
          token=$(echo "$answer" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Microsoft Entra refused: $(echo "$answer" | jq -c '{error, error_codes}')"
            exit 1
          fi
          echo "::add-mask::$token"
          mkdir -p store
          get() { curl -s -f -H "Authorization: Bearer $token" "$API/$1"; }
          # (Upload URLs carry a signature: never kept.)
          clean() { jq 'del(.. | .fileUploadUrl?)'; }
          get "applications/$PRODUCT_ID" | clean > store/app.json
          jq '{id, primaryName, packageFamilyName, pendingApplicationSubmission, lastPublishedApplicationSubmission}' store/app.json
          for which in lastPublishedApplicationSubmission pendingApplicationSubmission; do
            sid=$(jq -r ".$which.id // empty" store/app.json)
            [ -n "$sid" ] || { echo "$which: none"; continue; }
            get "applications/$PRODUCT_ID/submissions/$sid" | clean > "store/$which.json"
            echo "$which $sid: status $(jq -r '.status' "store/$which.json"), listings $(jq -c '.listings | keys' "store/$which.json"), packages $(jq '.applicationPackages | length' "store/$which.json")"
            jq -c '.listings | to_entries[] | {lang: .key, images: [.value.baseListing.images[]? | {imageType, fileName, fileStatus}] | length}' "store/$which.json"
          done
          ls -la store
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: store-check
          path: store/
          retention-days: 7
