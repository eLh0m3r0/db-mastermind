name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: mastermind
          POSTGRES_DB: mastermind
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mastermind
          MYSQL_DATABASE: mastermind
        ports: ['33069:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmastermind" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mastermind
          MARIADB_DATABASE: mastermind
        ports: ['33070:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Mastermind!2026'
        ports: ['14339:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Mastermind!2026' -Q 'select 1' || exit 1"
          --health-interval 5s --health-retries 60 --health-start-period 20s
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Mastermind2026
          APP_USER: shop
          APP_USER_PASSWORD: mastermind
        ports: ['15219:1521']
        options: >-
          --health-cmd healthcheck.sh --health-interval 5s --health-retries 60 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      # A service container takes no command: pg_stat_statements (Server activity → Top queries,
      # health.integration.test.ts) is preloaded through ALTER SYSTEM and a restart, as docker-compose.test.yml does
      # with its command line.
      - name: PostgreSQL with pg_stat_statements
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 60); do docker exec ${{ job.services.postgres.id }} pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -tAc 'SHOW shared_preload_libraries' | grep -q pg_stat_statements
          echo "DBM_PGSS_PORT=54329" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w packages/mcp
      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 18123:8123 -e CLICKHOUSE_USER=default -e CLICKHOUSE_PASSWORD=mastermind --ulimit nofile=262144:262144 clickhouse/clickhouse-server:24.8
          for i in $(seq 1 60); do curl -sf -u default:mastermind 'http://127.0.0.1:18123/?query=SELECT%201' >/dev/null && break; sleep 2; done
      - name: Start the BigQuery emulator
        run: |
          docker run -d --name bigquery -p 19050:9050 ghcr.io/goccy/bigquery-emulator:0.8.1 --project=dbm-test --dataset=shop
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:19050/bigquery/v2/projects/dbm-test/datasets >/dev/null && break; sleep 2; done
      - name: Start Trino
        run: |
          docker run -d --name trino -p 18080:8080 trinodb/trino:483
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:18080/v1/info | grep -q '"starting":false' && break; sleep 2; done
      - name: Start CockroachDB (needs a start command, so not a service container)
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:latest-v24.3 start-single-node --insecure
          for i in $(seq 1 60); do docker exec cockroach ./cockroach sql --insecure -e 'select 1' >/dev/null 2>&1 && break; sleep 2; done
      - name: Start an SSH server (tunnel tests reach the postgres service through it)
        run: |
          mkdir -p "$RUNNER_TEMP/ssh" && ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/ssh/id_test"
          # The registry rate-limits now and then ("toomanyrequests"): retry the pull.
          for i in 1 2 3 4 5; do docker pull -q lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls238 && break; sleep $((i * 15)); done
          docker run -d --name dbm-ssh --network ${{ job.services.postgres.network }} -p 2222:2222 -e PUID=1000 -e PGID=1000 -e USER_NAME=dbm -e USER_PASSWORD=sshsecret -e PASSWORD_ACCESS=true -e PUBLIC_KEY="$(cat "$RUNNER_TEMP/ssh/id_test.pub")" -e DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls238
          for i in $(seq 1 60); do docker logs dbm-ssh 2>&1 | grep -q 'ls.io-init] done' && nc -z 127.0.0.1 2222 && break; sleep 2; done
          echo "DBM_SSH_KEY=$RUNNER_TEMP/ssh/id_test" >> "$GITHUB_ENV"
      - name: Start PostgreSQL and MySQL with TLS (test CA)
        run: |
          scripts/tls-test-servers.sh "$RUNNER_TEMP/tls" "${{ job.services.postgres.network }}"
          echo "DBM_TLS_DIR=$RUNNER_TEMP/tls" >> "$GITHUB_ENV"
      - name: sqlpackage (SQL Server's own scripting of a database, for the dump test)
        run: |
          for i in 1 2 3; do dotnet tool install --global microsoft.sqlpackage --version 170.5.96 && break; sleep $((i * 15)); done
          # Three failed tries: say so here, not as an ENOENT in the dump test later.
          if [ ! -x "$HOME/.dotnet/tools/sqlpackage" ]; then echo "::error::sqlpackage could not be installed"; exit 1; fi
          echo "DBM_SQLPACKAGE=$HOME/.dotnet/tools/sqlpackage" >> "$GITHUB_ENV"
      - run: npm run test:integration
      - name: Build desktop bundles
        run: npx electron-vite build
        working-directory: apps/desktop

  # Every command palette entry and menu command, with no connection and in a query, table and model tab, in the
  # Czech UI: fails on page or console errors, error toasts and English text (e2e/ui-sweep.mjs).
  ui-sweep:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: mastermind
          POSTGRES_DB: mastermind
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Shop fixtures
        run: npx vitest run --project integration packages/core/test/drivers.integration.test.ts
        env:
          DBM_SKIP: mysql,mariadb,mssql,ms,duckdb,sqlite,oracle,cockroach,clickhouse,bigquery,trino
      - name: Build desktop bundles
        run: npx electron-vite build
        working-directory: apps/desktop
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses; allow them instead of
      # running Electron without its sandbox.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: UI sweep (virtual display)
        run: xvfb-run -a node e2e/ui-sweep.mjs ui-sweep cs --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-sweep
          path: ui-sweep
          retention-days: 7

  # Packages the app on every OS and runs the real executable (headless MCP mode against SQLite).
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: apps/desktop/release/win-unpacked/DB Mastermind.exe
          - os: macos-latest
            exe: apps/desktop/release/mac-arm64/DB Mastermind.app/Contents/MacOS/DB Mastermind
          - os: ubuntu-latest
            exe: apps/desktop/release/linux-unpacked/db-mastermind
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      - name: Package (unpacked)
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test (Linux needs a virtual display for Electron)
        if: runner.os == 'Linux'
        run: xvfb-run -a node e2e/smoke.mjs "${{ matrix.exe }}"
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict "apps/desktop/release/mac-arm64/DB Mastermind.app"
      - name: Smoke test
        if: runner.os != 'Linux'
        run: node e2e/smoke.mjs "${{ matrix.exe }}"
      - name: UI smoke test (drives the real app)
        if: runner.os != 'Linux'
        run: node e2e/ui-smoke.mjs "${{ matrix.exe }}" ui-shots
      - name: UI smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node e2e/ui-smoke.mjs "${{ matrix.exe }}" ui-shots
      - name: MSI package, silent install, smoke test from Program Files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd apps/desktop
          npx electron-builder --win msi --x64 --prepackaged release/win-unpacked --publish never
          $msi = Get-ChildItem release/*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\msi.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 40; throw "msiexec failed: $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles" -Recurse -Depth 2 -Filter "DB Mastermind.exe" | Select-Object -First 1
          if (-not $exe) { throw "DB Mastermind.exe not found under Program Files" }
          Write-Host "Installed: $($exe.FullName)"
          cd ../..
          node e2e/smoke.mjs "$($exe.FullName)"
          if (Test-Path (Join-Path $exe.DirectoryName 'data')) { throw "A per-machine install must not use portable mode" }
      - name: Microsoft Store package builds (placeholder identity)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: >
          npx electron-builder --win appx --x64 --prepackaged release/win-unpacked --publish never
          --config.appx.identityName=Test.DBMastermind --config.appx.publisher="CN=00000000-0000-0000-0000-000000000000"
          --config.appx.publisherDisplayName="Test" --config.appx.applicationId=DBMastermind --config.appx.displayName="DB Mastermind"
          && ls -la release/*.appx
          || { cat release/__appx-x64/AppxManifest.xml; exit 1; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ matrix.os }}
          path: ui-shots
          if-no-files-found: ignore

  # Linux packages run inside Chromium's sandbox where the system allows it, proven from the running renderer
  # (seccomp filter + own PID namespace, e2e/linux-sandbox.mjs). The .deb on Ubuntu 24.04 as it is (its install
  # script loads an AppArmor profile that allows user namespaces); the AppImage first as the system is (fallback to
  # --no-sandbox with one stderr line), then sandboxed once user namespaces are allowed. Also checked: the .desktop
  # launcher's command, a file given on the command line, a start with no arguments (how electron-updater restarts a
  # replaced AppImage) and the --mcp path agents are given.
  linux-sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      - name: Package (AppImage and .deb)
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder --linux AppImage deb --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: The system as it is
        run: |
          lsb_release -ds
          sysctl kernel.apparmor_restrict_unprivileged_userns
          if unshare -Ur true; then echo "unprivileged user namespaces: allowed"; else echo "unprivileged user namespaces: refused"; fi
      - name: Install the .deb
        run: |
          sudo apt-get install -y ./apps/desktop/release/DB-Mastermind-*-linux-amd64.deb
          stat -c '%a %U %n' "/opt/DB Mastermind/chrome-sandbox"
          sudo aa-status | grep -F db-mastermind
          grep '^Exec=' /usr/share/applications/db-mastermind.desktop
          if grep -q -- '--no-sandbox' /usr/share/applications/db-mastermind.desktop; then echo "::error::the .desktop entry still passes --no-sandbox"; exit 1; fi
          readlink -f "$(command -v db-mastermind)"
      - name: .deb, started from the command line with a file (sandboxed)
        if: ${{ !cancelled() }}
        run: xvfb-run -a node e2e/linux-sandbox.mjs /usr/bin/db-mastermind sandboxed
      - name: .deb, the .desktop launcher's command without arguments (sandboxed)
        if: ${{ !cancelled() }}
        run: xvfb-run -a node e2e/linux-sandbox.mjs "/opt/DB Mastermind/db-mastermind" sandboxed --plain
      - name: .deb, MCP server as agents start it
        if: ${{ !cancelled() }}
        run: xvfb-run -a node e2e/smoke.mjs "/opt/DB Mastermind/db-mastermind"
      - name: AppImage, prepared like a download
        if: ${{ !cancelled() }}
        run: |
          # The AppImage runtime mounts itself with FUSE 2, which Ubuntu 24.04 doesn't install by default.
          if ! ldconfig -p | grep -q 'libfuse.so.2'; then sudo apt-get install -y libfuse2t64; fi
          mkdir -p "$RUNNER_TEMP/apps"
          cp apps/desktop/release/DB-Mastermind-linux-x86_64.AppImage "$RUNNER_TEMP/apps/"
          chmod +x "$RUNNER_TEMP/apps/DB-Mastermind-linux-x86_64.AppImage"
          echo "APPIMAGE_FILE=$RUNNER_TEMP/apps/DB-Mastermind-linux-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: AppImage on the system as it is (fallback with the stderr line)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          xvfb-run -a node e2e/linux-sandbox.mjs "$APPIMAGE_FILE" fallback || rc=1
          xvfb-run -a node e2e/linux-sandbox.mjs "$APPIMAGE_FILE" fallback --plain || rc=1
          exit $rc
      - name: AppImage, MCP server as agents start it
        if: ${{ !cancelled() }}
        run: xvfb-run -a node e2e/smoke.mjs "$APPIMAGE_FILE"
      - name: Allow unprivileged user namespaces
        if: ${{ !cancelled() }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: AppImage with user namespaces allowed (sandboxed)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          xvfb-run -a node e2e/linux-sandbox.mjs "$APPIMAGE_FILE" sandboxed || rc=1
          xvfb-run -a node e2e/linux-sandbox.mjs "$APPIMAGE_FILE" sandboxed --plain || rc=1
          exit $rc

  # Code generated from models, checked by the tools themselves (packages/core/test/orm-export.tools.test.ts): pinned
  # prisma, drizzle-orm and typescript from npm into a temp folder, SQLAlchemy from pip in a venv. Needs the network.
  orm-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: python3 --version
      - name: Prisma, Drizzle, TypeScript and SQLAlchemy on the generated code
        run: npx vitest run --project unit packages/core/test/orm-export.tools.test.ts
        env:
          DBM_ORM_TOOLS: '1'

  # The npm package as it would be published: packed once, then installed from the tarball into an empty folder on
  # every OS and started the way users start it (npx dbmastermind-mcp over stdio, npx dbm query) against SQLite.
  mcp-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: npm pack (prepack builds dist/)
        run: mkdir -p "$RUNNER_TEMP/pack" && npm pack -w packages/mcp --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 7

  mcp-package:
    needs: mcp-pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.16 is the package's engines floor (node:sqlite's StatementSync.columns()).
        node: ['22.16', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: mcp-tarball
          path: ${{ runner.temp }}/pack
      - name: Install the tarball and run it
        run: node packages/mcp/test/packed-package.mjs --tarball "${{ runner.temp }}/pack"

  # SQL Server Windows (integrated) authentication through msnodesqlv8 + ODBC, against LocalDB.
  windows-auth:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install SQL Server LocalDB
        uses: potatoqualitee/mssqlsuite@v1.7
        with:
          install: localdb
      - run: npm install --no-audit --no-fund
      # Claude Code / Codex are .cmd shims run through cmd.exe here: arguments with quotes, & and % must arrive intact.
      - name: Agent CLIs start through cmd.exe
        run: npx vitest run --project unit apps/desktop/test/cli-launch.test.ts
      - name: List ODBC drivers
        shell: pwsh
        run: Get-OdbcDriver | Where-Object Name -like '*SQL Server*' | Select-Object Name
      - run: npx vitest run --project integration packages/core/test/winauth.integration.test.ts
        env:
          DBM_WINAUTH: '1'
