name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: mastermind
          POSTGRES_DB: mastermind
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mastermind
          MYSQL_DATABASE: mastermind
        ports: ['33069:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmastermind" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mastermind
          MARIADB_DATABASE: mastermind
        ports: ['33070:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Mastermind!2026'
        ports: ['14339:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Mastermind!2026' -Q 'select 1' || exit 1"
          --health-interval 5s --health-retries 60 --health-start-period 20s
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Mastermind2026
          APP_USER: shop
          APP_USER_PASSWORD: mastermind
        ports: ['15219:1521']
        options: >-
          --health-cmd healthcheck.sh --health-interval 5s --health-retries 60 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w packages/mcp
      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 18123:8123 -e CLICKHOUSE_USER=default -e CLICKHOUSE_PASSWORD=mastermind --ulimit nofile=262144:262144 clickhouse/clickhouse-server:24.8
          for i in $(seq 1 60); do curl -sf -u default:mastermind 'http://127.0.0.1:18123/?query=SELECT%201' >/dev/null && break; sleep 2; done
      - name: Start the BigQuery emulator
        run: |
          docker run -d --name bigquery -p 19050:9050 ghcr.io/goccy/bigquery-emulator:0.8.1 --project=dbm-test --dataset=shop
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:19050/bigquery/v2/projects/dbm-test/datasets >/dev/null && break; sleep 2; done
      - name: Start Trino
        run: |
          docker run -d --name trino -p 18080:8080 trinodb/trino:483
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:18080/v1/info | grep -q '"starting":false' && break; sleep 2; done
      - name: Start CockroachDB (needs a start command, so not a service container)
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:latest-v24.3 start-single-node --insecure
          for i in $(seq 1 60); do docker exec cockroach ./cockroach sql --insecure -e 'select 1' >/dev/null 2>&1 && break; sleep 2; done
      - run: npm run test:integration
      - name: Build desktop bundles
        run: npx electron-vite build
        working-directory: apps/desktop

  # Packages the app on every OS and runs the real executable (headless MCP mode against SQLite).
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: apps/desktop/release/win-unpacked/DB Mastermind.exe
          - os: macos-latest
            exe: apps/desktop/release/mac-arm64/DB Mastermind.app/Contents/MacOS/DB Mastermind
          - os: ubuntu-latest
            exe: apps/desktop/release/linux-unpacked/db-mastermind
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w packages/mcp
      - name: Package (unpacked)
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test (Linux needs a virtual display for Electron)
        if: runner.os == 'Linux'
        run: xvfb-run -a node e2e/smoke.mjs "${{ matrix.exe }}"
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict "apps/desktop/release/mac-arm64/DB Mastermind.app"
      - name: Smoke test
        if: runner.os != 'Linux'
        run: node e2e/smoke.mjs "${{ matrix.exe }}"
      - name: UI smoke test (drives the real app)
        if: runner.os != 'Linux'
        run: node e2e/ui-smoke.mjs "${{ matrix.exe }}" ui-shots
      - name: UI smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node e2e/ui-smoke.mjs "${{ matrix.exe }}" ui-shots
      - name: MSI package, silent install, smoke test from Program Files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd apps/desktop
          npx electron-builder --win msi --x64 --prepackaged release/win-unpacked --publish never
          $msi = Get-ChildItem release/*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\msi.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 40; throw "msiexec failed: $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles" -Recurse -Depth 2 -Filter "DB Mastermind.exe" | Select-Object -First 1
          if (-not $exe) { throw "DB Mastermind.exe not found under Program Files" }
          Write-Host "Installed: $($exe.FullName)"
          cd ../..
          node e2e/smoke.mjs "$($exe.FullName)"
          if (Test-Path (Join-Path $exe.DirectoryName 'data')) { throw "A per-machine install must not use portable mode" }
      - name: Microsoft Store package builds (placeholder identity)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: >
          npx electron-builder --win appx --x64 --prepackaged release/win-unpacked --publish never
          --config.appx.identityName=Test.DBMastermind --config.appx.publisher="CN=00000000-0000-0000-0000-000000000000"
          --config.appx.publisherDisplayName="Test" --config.appx.applicationId=DBMastermind --config.appx.displayName="DB Mastermind"
          && ls -la release/*.appx
          || { cat release/__appx-x64/AppxManifest.xml; exit 1; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ matrix.os }}
          path: ui-shots
          if-no-files-found: ignore

  # SQL Server Windows (integrated) authentication through msnodesqlv8 + ODBC, against LocalDB.
  windows-auth:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install SQL Server LocalDB
        uses: potatoqualitee/mssqlsuite@v1.7
        with:
          install: localdb
      - run: npm install --no-audit --no-fund
      - name: List ODBC drivers
        shell: pwsh
        run: Get-OdbcDriver | Where-Object Name -like '*SQL Server*' | Select-Object Name
      - run: npx vitest run --project integration packages/core/test/winauth.integration.test.ts
        env:
          DBM_WINAUTH: '1'
