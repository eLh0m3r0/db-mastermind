appId: dev.dbmastermind.app
productName: DB Mastermind
artifactName: DB-Mastermind-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
asar: true
# DuckDB's native binding (per platform package) loads from disk; after-pack removes the other platforms' copies.
asarUnpack:
  - '**/node_modules/@duckdb/**'
# Native modules ship N-API prebuilds (msnodesqlv8) or are optional (cpu-features): never compile from source.
npmRebuild: false
afterPack: build/after-pack.cjs
publish:
  provider: github
  owner: eLh0m3r0
  repo: db-mastermind
  releaseType: release
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID yet: build/after-pack.cjs applies an ad-hoc signature instead, so Apple Silicon
  # doesn't report the downloaded app as damaged.
  identity: null
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # The zip is the portable build: unzip and run, data is stored next to the exe.
  artifactName: DB-Mastermind-${version}-win-${arch}-portable.${ext}
# For Intune / SCCM / Group Policy: per-machine, silent with msiexec /i … /qn (built from win-unpacked).
msi:
  perMachine: true
  runAfterFinish: false
  artifactName: DB-Mastermind-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: DB-Mastermind-${version}-win-${arch}-setup.${ext}
linux:
  executableName: db-mastermind
  # Ubuntu 24.04+ restricts the user namespaces Chromium's sandbox needs; AppImages can't ship a SUID helper.
  executableArgs: ['--no-sandbox']
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: DB Mastermind contributors
