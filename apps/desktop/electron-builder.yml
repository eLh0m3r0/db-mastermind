appId: dev.dbmastermind.app
productName: DB Mastermind
artifactName: DB-Mastermind-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: eLh0m3r0
  repo: db-mastermind
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: DB-Mastermind-${version}-win-${arch}-setup.${ext}
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: DB Mastermind contributors
