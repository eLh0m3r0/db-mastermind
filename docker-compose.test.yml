# Throwaway databases for integration tests: `npm run db:up`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: mastermind
      POSTGRES_DB: mastermind
    ports: ['54329:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mastermind
      MYSQL_DATABASE: mastermind
    ports: ['33069:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pmastermind']
      interval: 2s
      retries: 60
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: mastermind
      MARIADB_DATABASE: mastermind
    ports: ['33070:3306']
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      retries: 60
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Mastermind!2026'
    ports: ['14339:1433']
    healthcheck:
      test: ['CMD-SHELL', "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Mastermind!2026' -Q 'select 1' || exit 1"]
      interval: 5s
      retries: 60
      start_period: 20s
